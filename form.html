<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Lamaran | Tech Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tech Community</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="gallery.html">Gallery</a>
                <a class="nav-link active" href="form.html">Form</a>
            </div>
        </div>
    </nav>
    <header>
        <h1>Tech Community</h1>
    </header>

    <div class="container">
        <h2>Formulir Biodata Pelamar</h2>
        <p>Silakan isi data diri kamu dengan lengkap dan benar untuk memproses lamaran.</p>
        <br>
        
        <form action="sukses.html" method="GET" id="memberForm">
            <div class="form-group">
                <label for="inputNama">Nama Lengkap</label>
                <input type="text" id="inputNama" name="nama" placeholder="Masukkan nama lengkapmu" required>
            </div>

            <div class="form-group">
                <label for="inputEmail">Alamat Email</label>
                <input type="email" id="inputEmail" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label for="inputMinat">Posisi yang Dilamar</label>
                <select id="inputMinat" name="posisi" required>
                    <option value="" disabled selected>-- Pilih Posisi --</option>
                    <option value="fotografher">Fotografher</option>
                    <option value="videografis">VideoGrafis</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Kirim Lamaran</button>
        </form>

            <div id="formResult"></div>
        </div>

        <script src="./script.js"></script>
</body>
</html>
