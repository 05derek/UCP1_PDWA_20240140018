<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Lamaran | Tech Community</title>
</head>
<body>
    <header>
        <h1>Tech Community</h1>
    </header>

    <div class="container">
        <h2>Formulir Biodata Pelamar</h2>
        <p>Silakan isi data diri kamu dengan lengkap dan benar untuk memproses lamaran.</p>
        <br>
        
        <form action="sukses.html" method="GET">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkapmu" required>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label for="posisi">Posisi yang Dilamar</label>
                <select id="posisi" name="posisi" required>
                    <option value="" disabled selected>-- Pilih Posisi --</option>
                    <option value="fotografher">Fotografher</option>
                    <option value="videografis">VideoGrafis</option>
                </select>
</body>
</html>
